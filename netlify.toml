# ------------------------------------------------------------------
# پیکربندی استقرار در Netlify
# ------------------------------------------------------------------

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# مسیر عمومی تابع دریافت درخواست مشاوره
[[redirects]]
  from = "/api/consultation"
  to = "/.netlify/functions/consultation"
  status = 200
  force = true

# ---------------------------- هدرها ----------------------------

# هدرهای امنیتی عمومی
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    X-XSS-Protection = "0"

# دارایی‌های هش‌دار: کش یک‌ساله
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# فونت‌ها: نام ثابت، کش طولانی
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# تصاویر: کش کوتاه‌تر تا جایگزینی تصویر فوراً دیده شود
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# صفحات HTML: همیشه بازبینی شوند
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# پنل مدیریت: غیرقابل ایندکس و با CSP لازم برای Decap CMS
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://identity.netlify.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https://api.netlify.com https://identity.netlify.com https://git-gateway.netlify.com; frame-src 'self' https://*.netlify.com; base-uri 'self'; form-action 'self' https://api.netlify.com"

# ------------------------------------------------------------------
# یادآوری: برای فعال‌سازی Cloudflare Turnstile، این میزبان‌ها را به
# CSP اصلی اضافه کنید:
#   script-src  ... https://challenges.cloudflare.com
#   frame-src   ... https://challenges.cloudflare.com
#   connect-src ... https://challenges.cloudflare.com
# ------------------------------------------------------------------
